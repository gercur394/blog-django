{% extends 'posts/base.html' %}

{% block content %}
    <h1>{% if form.instance.pk %}Editar post{% else %}Crear nuevo post{% endif %}</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar</button>
    </form>
{% endblock %}
