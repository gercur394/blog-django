{% extends 'posts/base.html' %}

{% block content %}
    <h1>{{ post.titulo }}</h1>
    <p><strong>Autor:</strong> {{ post.autor }} — <strong>Estado:</strong> {{ post.estado }} — <strong>Fecha:</strong> {{ post.fecha_creacion }}</p>

    {% if post.imagen %}
        <img src="{{ post.imagen.url }}" alt="{{ post.titulo }}" style="max-width: 100%;">
    {% endif %}

    <p>{{ post.contenido }}</p>

    <a href="{% url 'editar_post' slug=post.slug %}">Editar</a>
    <a href="{% url 'eliminar_post' slug=post.slug %}">Eliminar</a>
    <a href="{% url 'lista_posts' %}">Volver al listado</a>
{% endblock %}
