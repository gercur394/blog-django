{% extends 'posts/base.html' %}

{% block content %}
    <h1>Confirmar eliminación</h1>
    <p>¿Estás seguro de que querés eliminar el post "{{ post.titulo }}"? Esta acción no se puede deshacer.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
        <a href="{% url 'detalle_post' slug=post.slug %}">Cancelar</a>
    </form>
{% endblock %}
